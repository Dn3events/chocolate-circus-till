<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d80f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chocolate Circus">
<meta name="description" content="Chocolate Circus stall till.">
<title>Chocolate Circus Till</title>
<style>
:root{
  color-scheme:light;
  --red:#d80f26;
  --red-deep:#a80b1e;
  --ink:#14100e;
  --cream:#fff6e8;
  --cream2:#ffeccf;
  --gold:#f7c948;
  --pink:#ff9ecf;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100svh;
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 12% 16%,#ffffff2b 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 84% 30%,#ffffff2b 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 20% 74%,#ffffff2b 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 70% 86%,#ffffff2b 0 1.5px,transparent 2.5px),
    radial-gradient(ellipse at 50% -14%,#f2323f 0,#d80f26 46%,#a80b1e 100%);
  background-color:var(--red);
  padding:env(safe-area-inset-top) 0 var(--safe-bottom);
}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.slab{
  display:inline-block;
  background:var(--ink);
  color:#fff;
  font-family:"Arial Narrow","Franklin Gothic Medium","Avenir Next Condensed",system-ui,sans-serif;
  font-weight:800;
  letter-spacing:.04em;
  text-transform:uppercase;
}
.app{
  position:relative;
  z-index:1;
  width:min(100%,920px);
  min-height:calc(100svh - env(safe-area-inset-top) - var(--safe-bottom));
  margin:auto;
  padding:clamp(12px,2.6vh,26px) clamp(14px,4vw,32px) clamp(12px,2.4vh,22px);
  display:flex;flex-direction:column;gap:clamp(12px,2.4vh,22px);
}
.brand{text-align:center;flex:none}
.logo-plaque{
  display:inline-flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 20px 12px;
  background:var(--cream);
  border:3px solid var(--ink);
  border-radius:18px;
  box-shadow:0 5px 0 #0000008c,0 10px 22px #4a020b66;
  transform:rotate(-1.2deg);
}
.brand-logo{display:block;width:clamp(170px,38vw,260px);height:auto;border-radius:10px}
.tagline{
  margin:9px 0 0;
  font-family:"Arial Narrow","Franklin Gothic Medium",system-ui,sans-serif;
  font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  font-size:clamp(11px,1.8vw,14px);color:#ffe3a1;text-shadow:0 2px 4px #6a0410;
}
.products{
  flex:1;display:grid;gap:clamp(10px,2vw,18px);
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(120px,1fr));
  min-height:0;
}
.product{
  position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
  min-height:112px;padding:14px 10px 16px;
  border:3px solid var(--ink);border-radius:20px;
  background:linear-gradient(160deg,#fffdf6 0%,var(--cream) 60%,var(--cream2) 100%);
  color:var(--ink);
  box-shadow:0 7px 0 #00000080,0 12px 22px #4a020b59;
  cursor:pointer;transition:transform .08s,box-shadow .08s;
}
.product:active{transform:translateY(4px);box-shadow:0 3px 0 #00000080,0 6px 12px #4a020b59}
.product:focus-visible,.order-bar button:focus-visible,.celebration-clear:focus-visible{outline:4px solid #fff;outline-offset:3px}
.product-art{height:clamp(96px,17.5vh,155px);width:auto;max-width:82%;object-fit:contain;border-radius:13px;border:2.5px solid var(--ink);box-shadow:0 3px 0 #00000059;transform:rotate(-1.2deg);background:var(--red)}

.product-name{
  font-family:"Arial Narrow","Franklin Gothic Medium","Avenir Next Condensed",system-ui,sans-serif;
  font-weight:800;font-size:clamp(16px,2.4vw,21px);line-height:1.12;text-align:center;text-transform:uppercase;letter-spacing:.02em;
}
.product-note{font-size:clamp(10px,1.5vw,12px);font-weight:600;color:#7a5b3f;text-align:center;line-height:1.15}
.product-price{
  margin-top:4px;padding:2px 12px;
  background:var(--ink);color:#fff;
  font-family:"Arial Narrow","Franklin Gothic Medium",system-ui,sans-serif;
  font-size:clamp(18px,2.9vw,25px);font-weight:800;font-variant-numeric:tabular-nums;
  transform:rotate(-1deg);
}
.product-extra{border-style:dashed;background:linear-gradient(160deg,#fff3f8,#ffe9f2)}
.product-extra .product-note{color:#a2547d}
.product.shake{animation:shake .32s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.order-bar{
  flex:none;display:grid;gap:clamp(8px,1.7vw,14px);
  grid-template-columns:58px minmax(90px,.9fr) minmax(180px,2.6fr);
  min-height:clamp(92px,16vh,122px);
  filter:drop-shadow(0 5px 7px #4a020b4d);
}
.order-bar button{border:0;border-radius:17px;cursor:pointer}
.undo{display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink)!important;color:var(--ink);box-shadow:0 5px 0 #00000073}
.undo svg{width:clamp(25px,4vw,34px);height:clamp(25px,4vw,34px);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.clear-button{background:var(--ink);color:#fff;font-size:clamp(16px,2.5vw,21px);font-weight:800;letter-spacing:.03em;box-shadow:0 5px 0 #00000080}
.total-button{
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 12px;
  background:linear-gradient(145deg,#ffd964,var(--gold));
  border:3px solid var(--ink)!important;color:var(--ink);
  box-shadow:0 5px 0 #6e520f;text-align:right;
}
.total-breakdown{flex:1 1 auto;min-width:0;max-height:4.5em;align-self:center;display:flex;flex-direction:column;gap:3px;overflow-x:hidden;overflow-y:auto;text-align:left}
.breakdown-line{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0;font-size:clamp(9px,1.35vw,12px);line-height:1.25;font-variant-numeric:tabular-nums}
.breakdown-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.breakdown-price{flex:none;font-weight:800;white-space:nowrap}
.breakdown-empty{font-size:clamp(9px,1.35vw,12px);font-weight:700;opacity:.7}
.total-summary{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.total-label{font-weight:800;font-size:11px;letter-spacing:.16em}
.total-value{font-size:clamp(26px,4.8vw,44px);line-height:1.02;font-weight:800;font-variant-numeric:tabular-nums}
.total-hint{font-size:10px;font-weight:600;color:#6e520f}
.celebration{
  position:fixed;inset:0;z-index:5;overflow:hidden;display:grid;place-items:center;
  padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + var(--safe-bottom));
  background:
    radial-gradient(circle at 12% 18%,#ffffff29 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 86% 63%,#ffffff29 0 1.5px,transparent 2.5px),
    radial-gradient(ellipse at center,#e32436 0,#a80b1e 55%,#5c0510 100%);
  color:#fff;text-align:center;
}
.celebration[hidden]{display:none}
.celebration-content{position:absolute;top:24%;left:0;width:100%;z-index:3;text-align:center;animation:appear .45s cubic-bezier(.2,1.5,.5,1) both}
.celebration-total{
  position:relative;z-index:3;
  font-family:"Arial Narrow","Franklin Gothic Medium","Avenir Next Condensed",system-ui,sans-serif;
  font-weight:800;font-size:clamp(76px,20vw,190px);line-height:1;font-variant-numeric:tabular-nums;
  color:#fff;text-shadow:0 5px 0 #5c0510,0 0 6px #2b0207,0 0 22px #2b0207,0 0 44px #2b0207cc;
}
.celebration:not([hidden]) .celebration-total{animation:total-flash 1.6s ease-out both}
@keyframes total-flash{0%{transform:scale(.4);opacity:0;filter:brightness(2.4)}14%{transform:scale(1.18);opacity:1;filter:brightness(2.2)}28%{transform:scale(.97);filter:brightness(1.1)}42%{transform:scale(1.06);filter:brightness(1.7)}100%{transform:scale(1);filter:brightness(1)}}
.celebration-clear{
  position:absolute;z-index:4;right:clamp(20px,5vw,54px);bottom:calc(20px + var(--safe-bottom));
  padding:15px 25px;border:3px solid var(--ink);border-radius:16px;
  background:var(--gold);color:var(--ink);font-size:18px;font-weight:800;
  box-shadow:0 5px 0 #6e520f;cursor:pointer;
}
.star-field{position:absolute;inset:0;pointer-events:none;z-index:2}
.star{position:absolute;left:var(--x);top:var(--y);color:var(--gold);font-size:var(--size);opacity:0;animation:twinkle var(--duration) ease-in-out var(--delay) infinite}
.star:nth-child(3n){color:#fff4d4}
.star:nth-child(4n){color:var(--pink)}
@keyframes appear{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}45%{opacity:.85;transform:scale(1) rotate(30deg)}}
.fireworks-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
/* Circus top trim */
.big-top{position:fixed;left:0;right:0;top:0;z-index:0;height:74px;pointer-events:none;overflow:hidden}
.big-top::before{
  content:"";position:absolute;left:-10%;right:-10%;top:-40px;height:104px;
  background:repeating-linear-gradient(90deg,var(--cream) 0 34px,var(--red-deep) 34px 68px);
  border-bottom:5px solid var(--ink);
  border-radius:0 0 50% 50%;
  filter:drop-shadow(0 3px 4px #4a020b);
}
@media(max-width:560px){
  .app{padding-left:12px;padding-right:12px}
  .order-bar{grid-template-columns:50px minmax(78px,.8fr) minmax(158px,1.9fr);gap:6px;min-height:92px}
  .total-button{gap:5px;padding:7px 9px}
  .total-value{font-size:clamp(23px,6.6vw,30px)}
  .total-hint{display:none}
  .breakdown-line,.breakdown-empty{font-size:9px}
  .products{grid-template-rows:repeat(2,minmax(104px,1fr))}
}
@media(max-height:620px) and (orientation:landscape){
  .app{width:min(100%,1100px);padding:10px 20px;gap:10px;display:grid;grid-template-columns:170px 1fr;grid-template-rows:1fr auto}
  .brand{grid-row:1/3;align-self:start;padding-top:8px}
  .logo-plaque{padding:7px 10px}
  .brand-logo{width:130px}
  .tagline{font-size:10px}
  .products{grid-column:2;grid-row:1;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:1fr;gap:10px}
  .product{min-height:0;padding:8px 5px;border-radius:15px}
  .product-art{height:74px}.product-name{font-size:13px}.product-price{font-size:17px}.product-note{font-size:9px}
  .order-bar{grid-column:2;grid-row:2;min-height:78px;grid-template-columns:58px 1fr 1.7fr}
  .total-value{font-size:clamp(24px,4vw,34px)}
  .celebration-content{top:15%}
  .celebration-clear{font-size:15px;padding:11px 18px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .celebration:not([hidden]) .celebration-total{animation:none}
}
</style>
</head>

<script>
(() => {
  'use strict';
  let order = [];
  const totalNode = document.getElementById('total');
  const breakdownNode = document.getElementById('items-breakdown');
  const totalButton = document.getElementById('open-total');
  const celebration = document.getElementById('celebration');
  const celebrationTotal = document.getElementById('celebration-total');
  const mainScreen = document.getElementById('main-screen');
  const pounds = pence => `£${(pence / 100).toFixed(2)}`;
  const sum = () => order.reduce((total, item) => total + item.pence, 0);
  function render() {
    const value = pounds(sum());
    totalNode.textContent = value;
    totalButton.setAttribute('aria-label', `Order total ${value}; ${order.length} ${order.length === 1 ? 'item' : 'items'}`);
    celebrationTotal.textContent = value;
    const grouped = new Map();
    order.forEach(item => {
      const current = grouped.get(item.name) || { count: 0, pence: 0 };
      current.count += 1;
      current.pence += item.pence;
      grouped.set(item.name, current);
    });
    breakdownNode.replaceChildren();
    if (grouped.size === 0) {
      const empty = document.createElement('span');
      empty.className = 'breakdown-empty';
      empty.textContent = 'No items yet';
      breakdownNode.appendChild(empty);
    } else {
      grouped.forEach((group, name) => {
        const line = document.createElement('span');
        line.className = 'breakdown-line';
        const label = document.createElement('span');
        label.className = 'breakdown-name';
        label.textContent = `${group.count} × ${name}`;
        label.title = label.textContent;
        const subtotal = document.createElement('span');
        subtotal.className = 'breakdown-price';
        subtotal.textContent = pounds(group.pence);
        line.append(label, subtotal);
        breakdownNode.appendChild(line);
      });
    }
  }
  const hasDrink = () => order.some(item => item.name === 'Stacked (OG)');
  document.querySelectorAll('.product[data-pence]').forEach(button => {
    button.addEventListener('click', () => {
      // Extras only go in the hot chocolate drink; the cone is flat, per the price list.
      if (button.dataset.extra && !hasDrink()) {
        button.classList.remove('shake');
        void button.offsetWidth;
        button.classList.add('shake');
        return;
      }
      order.push({
        pence: Number(button.dataset.pence),
        name: button.dataset.breakdown || button.querySelector('.product-name').textContent.trim()
      });
      render();
    });
  });
  document.getElementById('undo').addEventListener('click', () => { order.pop(); render(); });
  function clearOrder() {
    order = [];
    render();
    celebration.hidden = true;
    stopFireworks();
    stopChaChing();
    mainScreen.inert = false;
    mainScreen.removeAttribute('aria-hidden');
  }
  document.getElementById('clear').addEventListener('click', clearOrder);
  document.getElementById('celebration-clear').addEventListener('click', clearOrder);
  // Celebration: the total flashes up with fireworks and a till "cha-ching".
  let fxCanvas = null, fxFrame = 0, fxTimer = 0, fxSound = null;
  function playChaChing() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    try {
      const context = new AudioContext();
      fxSound = context;
      const now = context.currentTime;
      const master = context.createGain();
      master.gain.value = .9;
      master.connect(context.destination);
      const len = Math.floor(context.sampleRate * .14);
      const buffer = context.createBuffer(1, len, context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const noise = context.createBufferSource();
      noise.buffer = buffer;
      const band = context.createBiquadFilter();
      band.type = 'bandpass'; band.frequency.value = 2600; band.Q.value = .8;
      const noiseGain = context.createGain();
      noiseGain.gain.value = .5;
      noise.connect(band).connect(noiseGain).connect(master);
      noise.start(now);
      const thunk = context.createOscillator();
      const thunkGain = context.createGain();
      thunk.type = 'sine';
      thunk.frequency.setValueAtTime(190, now);
      thunk.frequency.exponentialRampToValueAtTime(70, now + .12);
      thunkGain.gain.setValueAtTime(.5, now);
      thunkGain.gain.exponentialRampToValueAtTime(.0001, now + .14);
      thunk.connect(thunkGain).connect(master);
      thunk.start(now); thunk.stop(now + .16);
      [[2093, .13, 1.5], [2637, .19, 1.9]].forEach(([frequency, offset, ring]) => {
        const start = now + offset;
        [[1, .22], [2.76, .09], [5.4, .04], [8.93, .018]].forEach(([ratio, volume]) => {
          const osc = context.createOscillator();
          const gain = context.createGain();
          osc.type = 'sine';
          osc.frequency.value = frequency * ratio;
          gain.gain.setValueAtTime(.0001, start);
          gain.gain.exponentialRampToValueAtTime(volume, start + .004);
          gain.gain.exponentialRampToValueAtTime(.0001, start + ring / ratio ** .35);
          osc.connect(gain).connect(master);
          osc.start(start);
          osc.stop(start + ring + .05);
        });
      });
      window.setTimeout(() => { try { context.close(); } catch (_) {} if (fxSound === context) fxSound = null; }, 3000);
    } catch (_) { /* Sound is a bonus; the celebration still opens if audio is unavailable. */ }
  }
  function stopChaChing() {
    if (!fxSound) return;
    try { fxSound.close(); } catch (_) { /* ignore */ }
    fxSound = null;
  }
  const FX_COLORS = ['#ffd45a', '#ff5d5d', '#ff9ecf', '#fff4d4', '#f7c948', '#ffb347', '#ffffff'];
  function startFireworks() {
    stopFireworks();
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!fxCanvas) {
      fxCanvas = document.createElement('canvas');
      fxCanvas.setAttribute('aria-hidden', 'true');
      fxCanvas.className = 'fireworks-canvas';
      celebration.insertBefore(fxCanvas, celebration.firstChild);
    }
    const canvas = fxCanvas;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const width = canvas.clientWidth || window.innerWidth;
    const height = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    const baseBox = canvas.getBoundingClientRect();
    const totalBox = celebrationTotal.getBoundingClientRect();
    const cx = totalBox.left + totalBox.width / 2 - baseBox.left;
    const cy = totalBox.top + totalBox.height / 2 - baseBox.top;
    const rx = celebrationTotal.offsetWidth / 2 * 1.12 + 34;
    const ry = celebrationTotal.offsetHeight / 2 * 1.1 + 34;
    const mask = `radial-gradient(ellipse ${rx}px ${ry}px at ${cx}px ${cy}px, transparent 62%, #000 100%)`;
    canvas.style.webkitMaskImage = mask;
    canvas.style.maskImage = mask;
    let sparks = [];
    let last = performance.now();
    function burst(x, y) {
      const color = FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
      const alt = FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
      const count = 46 + Math.floor(Math.random() * 24);
      const power = Math.min(width, height) * (.30 + Math.random() * .22);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + Math.random() * .12;
        const speed = power * (.45 + Math.random() * .55);
        sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0, max: 1.1 + Math.random() * .7, color: i % 3 === 0 ? alt : color });
      }
    }
    function launch() {
      burst(width * (.12 + Math.random() * .76), height * (.12 + Math.random() * .5));
    }
    burst(width * .5, height * .3);
    [220, 420, 640].forEach(delay => window.setTimeout(launch, delay));
    fxTimer = window.setInterval(launch, 700);
    function frame(time) {
      const dt = Math.min((time - last) / 1000, .05);
      last = time;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'lighter';
      sparks = sparks.filter(s => s.life < s.max);
      ctx.save();
      sparks.forEach(s => {
        s.life += dt;
        s.vx *= 1 - 1.6 * dt;
        s.vy = s.vy * (1 - 1.6 * dt) + 150 * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        const fade = Math.max(0, 1 - s.life / s.max);
        ctx.globalAlpha = fade;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, 1.2 + 2.2 * fade, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.restore();
      fxFrame = window.requestAnimationFrame(frame);
    }
    fxFrame = window.requestAnimationFrame(frame);
  }
  function stopFireworks() {
    if (fxFrame) window.cancelAnimationFrame(fxFrame);
    if (fxTimer) window.clearInterval(fxTimer);
    fxFrame = 0; fxTimer = 0;
    if (fxCanvas) {
      const ctx = fxCanvas.getContext('2d');
      if (ctx) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); }
    }
  }
  totalButton.addEventListener('click', () => {
    if (sum() === 0) return;
    render();
    celebration.hidden = false;
    mainScreen.inert = true;
    mainScreen.setAttribute('aria-hidden', 'true');
    playChaChing();
    startFireworks();
  });
  const stars = document.querySelector('.star-field');
  for (let i = 0; i < 34; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = i % 5 === 0 ? '✦' : '★';
    star.style.setProperty('--x', `${(i * 37 + 11) % 97}%`);
    star.style.setProperty('--y', `${(i * 61 + 7) % 92}%`);
    star.style.setProperty('--size', `${10 + (i * 7) % 18}px`);
    star.style.setProperty('--delay', `${(i % 9) * -0.31}s`);
    star.style.setProperty('--duration', `${1.4 + (i % 5) * 0.4}s`);
    stars.appendChild(star);
  }
  // Each load starts with an empty order; nothing is persisted.
  render();
  // Test hook: open file with #demo to preview a filled order and the celebration.
  if (location.hash === '#demo') {
    order = [
      { pence: 750, name: 'Stacked (OG)' },
      { pence: 750, name: 'Stacked (OG)' },
      { pence: 250, name: 'Shot (Baileys / Triple Sec)' },
      { pence: 650, name: "S'mores cone" }
    ];
    render();
    totalButton.click();
  }
})();
</script>
